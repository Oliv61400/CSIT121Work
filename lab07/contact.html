   <main>

    <h2> What do you think? </h2>
    <p> Form does not send, for Lab 7 only</p>

    <form>

      <label for="name"> Name</label><br>
      <input type="text" id="name" name="name"><br><br>

      <label for="email">Email</label><br>
      <input type="email" id="email" name="email"><br><br>

      <label for="favorite">What's your favorite fruit from the list? </label><br>
      <select id="favorite" name="favorite">

        <option value="">Select one</option>
        <option value="mango"> Mango </option>
        <option value="strawberry"> Strawberry </option>
        <option value="apple"> Apple </option>
        <option value="banana"> Banana </option>
        <option value="orange"> Orange </option>
        <option value="grapefruit"> Grapefruit </option>

    </select> <br><br>

    <p> Which tier do you agree with me the most?</p>

    <label><input type="radio" name="tier" value="S">S</label>
    <label><input type="radio" name="tier" value="A">A</label>
    <label><input type="radio" name="tier" value="B">B</label>
    <label><input type="radio" name="tier" value="C">C</label>
    <label><input type="radio" name="tier" value="D">D</label>
    <label><input type="radio" name="tier" value="F">F</label> <br><br>

    <p> What attribute do you care most about with eating fruit? </p>

    <label><input type="checkbox" name="reason" value="taste">Taste</label>
    <label><input type="checkbox" name="reason" value="texture">Texture</label>
    <label><input type="checkbox" name="reason" value="healthy">How healthy it is </label> <br><br>

    <label for="comments">Any other comments?</label>
    <textarea id="comments" name="comments" rows="4"></textarea> <br><br>

    <button type="submit">Submit</button>

   </form>

   </main>
